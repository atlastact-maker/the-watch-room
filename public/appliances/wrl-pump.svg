<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 540" font-family="'Inter', 'Helvetica Neue', sans-serif">

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <linearGradient id="body-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9F1515"/>
      <stop offset="50%" stop-color="#C01E1E"/>
      <stop offset="100%" stop-color="#9F1515"/>
    </linearGradient>

    <linearGradient id="cab-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#AE1A1A"/>
      <stop offset="50%" stop-color="#CE2424"/>
      <stop offset="100%" stop-color="#AE1A1A"/>
    </linearGradient>

    <pattern id="chequer-pattern" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#8A8A82"/>
      <polygon points="3,1 5,3 3,5 1,3" fill="#6A6A62" opacity="0.5"/>
      <polygon points="3,0.5 4.5,3 3,5.5 1.5,3" fill="#A8A8A0" opacity="0.3"/>
    </pattern>

    <linearGradient id="toolbox-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B1010"/>
      <stop offset="50%" stop-color="#A81818"/>
      <stop offset="100%" stop-color="#8B1010"/>
    </linearGradient>

    <linearGradient id="ladder-rail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6A6A5C"/>
      <stop offset="50%" stop-color="#B8B6A8"/>
      <stop offset="100%" stop-color="#6A6A5C"/>
    </linearGradient>

    <linearGradient id="rung" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8A8780"/>
      <stop offset="50%" stop-color="#C0BEB0"/>
      <stop offset="100%" stop-color="#8A8780"/>
    </linearGradient>

    <linearGradient id="mast-white" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C8C6BE"/>
      <stop offset="50%" stop-color="#F0EEE4"/>
      <stop offset="100%" stop-color="#C8C6BE"/>
    </linearGradient>
  </defs>

  <rect width="260" height="540" fill="none"/>

  <g transform="translate(130, 270)" filter="url(#shadow)">

    <!-- WHEELS -->
    <g fill="#0A0A0A">
      <rect x="-82" y="-200" width="6" height="24" rx="1.5"/>
      <rect x="76" y="-200" width="6" height="24" rx="1.5"/>
      <rect x="-82" y="72" width="6" height="34" rx="1.5"/>
      <rect x="76" y="72" width="6" height="34" rx="1.5"/>
    </g>

    <!-- CAB -->
    <rect x="-76" y="-240" width="152" height="172" rx="4" fill="url(#cab-red)" stroke="#5A0A0A" stroke-width="0.8"/>

    <!-- Front bumper -->
    <path d="M -76 -240 Q -76 -244 -70 -244 L 70 -244 Q 76 -244 76 -240 L 76 -225 L -76 -225 Z"
          fill="#3A3A3A" stroke="#1A1A1A" stroke-width="0.6"/>

    <!-- Red/white chevrons on front -->
    <g>
      <rect x="-72" y="-225" width="144" height="18" fill="#9F1515"/>
      <g fill="#FFFFFF">
        <polygon points="-72,-207 -62,-225 -52,-225 -62,-207"/>
        <polygon points="-52,-207 -42,-225 -32,-225 -42,-207"/>
        <polygon points="-32,-207 -22,-225 -12,-225 -22,-207"/>
        <polygon points="-12,-207 -2,-225 8,-225 -2,-207"/>
        <polygon points="8,-207 18,-225 28,-225 18,-207"/>
        <polygon points="28,-207 38,-225 48,-225 38,-207"/>
        <polygon points="48,-207 58,-225 68,-225 58,-207"/>
      </g>
    </g>

    <!-- Headlights -->
    <rect x="-68" y="-243" width="12" height="5" rx="1" fill="#F8F0D8" stroke="#8B8470" stroke-width="0.3"/>
    <rect x="56" y="-243" width="12" height="5" rx="1" fill="#F8F0D8" stroke="#8B8470" stroke-width="0.3"/>

    <!-- Grille -->
    <rect x="-16" y="-243" width="32" height="6" fill="#1A1A1A"/>

    <!-- Windscreen -->
    <path d="M -72 -207 L -62 -168 L 62 -168 L 72 -207 Z" fill="#1A2535" stroke="#0A1520" stroke-width="0.6"/>
    <path d="M -64 -202 L -56 -172 L 0 -172 L 0 -202 Z" fill="#4A6A8A" opacity="0.4"/>

    <!-- Cab roof -->
    <rect x="-72" y="-168" width="144" height="96" fill="url(#cab-red)" stroke="#5A0A0A" stroke-width="0.5"/>

    <!-- LED LIGHT BAR -->
    <g>
      <rect x="-58" y="-164" width="116" height="14" rx="2" fill="#1A1A2A" stroke="#000000" stroke-width="0.6"/>
      <rect x="-55" y="-162" width="20" height="6" rx="1" fill="#4A6AFF" opacity="0.75"/>
      <rect x="-33" y="-162" width="20" height="6" rx="1" fill="#4A6AFF" opacity="0.75"/>
      <rect x="-10" y="-162" width="8" height="6" rx="0.5" fill="#D4A020" opacity="0.75"/>
      <rect x="2" y="-162" width="8" height="6" rx="0.5" fill="#D4A020" opacity="0.75"/>
      <rect x="13" y="-162" width="20" height="6" rx="1" fill="#4A6AFF" opacity="0.75"/>
      <rect x="35" y="-162" width="20" height="6" rx="1" fill="#4A6AFF" opacity="0.75"/>
      <rect x="-56" y="-163" width="114" height="1" fill="#5A6A8A" opacity="0.5"/>
    </g>

    <!-- Wing mirrors -->
    <rect x="-88" y="-210" width="10" height="14" rx="1.5" fill="#2A0A0A"/>
    <rect x="78" y="-210" width="10" height="14" rx="1.5" fill="#2A0A0A"/>

    <!-- Cab side windows - front doors -->
    <rect x="-76" y="-164" width="4" height="30" fill="#2A3A4A"/>
    <rect x="72" y="-164" width="4" height="30" fill="#2A3A4A"/>

    <!-- B-pillar -->
    <rect x="-76" y="-134" width="4" height="5" fill="#4A0A0A"/>
    <rect x="72" y="-134" width="4" height="5" fill="#4A0A0A"/>

    <!-- Crew cab windows - rear doors -->
    <rect x="-76" y="-129" width="4" height="50" fill="#2A3A4A"/>
    <rect x="72" y="-129" width="4" height="50" fill="#2A3A4A"/>

    <!-- C-pillar -->
    <rect x="-76" y="-79" width="4" height="5" fill="#4A0A0A"/>
    <rect x="72" y="-79" width="4" height="5" fill="#4A0A0A"/>

    <!-- Central crew cab window/skylight -->
    <g>
      <rect x="-22" y="-120" width="44" height="36" rx="2" fill="#2A3A4A" stroke="#1A2530" stroke-width="0.6"/>
      <rect x="-20" y="-118" width="40" height="32" fill="#1A2535"/>
      <rect x="-20" y="-118" width="40" height="2" fill="#4A6A8A" opacity="0.4"/>
    </g>

    <!-- Cab-to-body seam -->
    <line x1="-76" y1="-68" x2="76" y2="-68" stroke="#6A0A0A" stroke-width="0.5"/>

    <!-- E1 BODY -->
    <rect x="-80" y="-68" width="160" height="265" rx="3" fill="url(#body-red)" stroke="#5A0A0A" stroke-width="0.8"/>

    <!-- GREY CHEQUER PLATE ROOF WALKING SURFACE -->
    <rect x="-74" y="-64" width="148" height="255" rx="2" fill="url(#chequer-pattern)" stroke="#4A4A42" stroke-width="0.8"/>

    <!-- Black beading trim -->
    <rect x="-74" y="-64" width="148" height="255" rx="2" fill="none" stroke="#1A1A1A" stroke-width="1.2"/>

    <!-- LADDER RACK MOUNTS -->
    <g>
      <rect x="-50" y="-62" width="74" height="4" fill="#3A3A2A" stroke="#1A1A10" stroke-width="0.3"/>
      <rect x="-50" y="179" width="74" height="4" fill="#3A3A2A" stroke="#1A1A10" stroke-width="0.3"/>
    </g>

    <!-- LEFT LADDER -->
    <g>
      <rect x="-50" y="-58" width="3" height="245" fill="url(#ladder-rail)" stroke="#3A3A30" stroke-width="0.3"/>
      <rect x="-36" y="-58" width="3" height="245" fill="url(#ladder-rail)" stroke="#3A3A30" stroke-width="0.3"/>

      <g fill="url(#rung)" stroke="#3A3A30" stroke-width="0.2">
        <rect x="-47" y="-52" width="11" height="2.5"/>
        <rect x="-47" y="-40" width="11" height="2.5"/>
        <rect x="-47" y="-28" width="11" height="2.5"/>
        <rect x="-47" y="-16" width="11" height="2.5"/>
        <rect x="-47" y="-4" width="11" height="2.5"/>
        <rect x="-47" y="8" width="11" height="2.5"/>
        <rect x="-47" y="20" width="11" height="2.5"/>
        <rect x="-47" y="32" width="11" height="2.5"/>
        <rect x="-47" y="44" width="11" height="2.5"/>
        <rect x="-47" y="56" width="11" height="2.5"/>
        <rect x="-47" y="68" width="11" height="2.5"/>
        <rect x="-47" y="80" width="11" height="2.5"/>
        <rect x="-47" y="92" width="11" height="2.5"/>
        <rect x="-47" y="104" width="11" height="2.5"/>
        <rect x="-47" y="116" width="11" height="2.5"/>
        <rect x="-47" y="128" width="11" height="2.5"/>
        <rect x="-47" y="140" width="11" height="2.5"/>
        <rect x="-47" y="152" width="11" height="2.5"/>
        <rect x="-47" y="164" width="11" height="2.5"/>
        <rect x="-47" y="176" width="11" height="2.5"/>
      </g>
    </g>

    <!-- CENTRE LADDER -->
    <rect x="-22" y="-150" width="46" height="4" fill="#3A3A2A" stroke="#1A1A10" stroke-width="0.3"/>
    <rect x="-22" y="-110" width="46" height="4" fill="#3A3A2A" stroke="#1A1A10" stroke-width="0.3"/>

    <g>
      <rect x="-22" y="-180" width="3" height="367" fill="url(#ladder-rail)" stroke="#3A3A30" stroke-width="0.3"/>
      <rect x="21" y="-180" width="3" height="367" fill="url(#ladder-rail)" stroke="#3A3A30" stroke-width="0.3"/>

      <g fill="url(#rung)" stroke="#3A3A30" stroke-width="0.2">
        <rect x="-19" y="-174" width="40" height="3"/>
        <rect x="-19" y="-162" width="40" height="3"/>
        <rect x="-19" y="-150" width="40" height="3"/>
        <rect x="-19" y="-138" width="40" height="3"/>
        <rect x="-19" y="-126" width="40" height="3"/>
        <rect x="-19" y="-114" width="40" height="3"/>
        <rect x="-19" y="-102" width="40" height="3"/>
        <rect x="-19" y="-90" width="40" height="3"/>
      </g>

      <g fill="url(#rung)" stroke="#3A3A30" stroke-width="0.2">
        <rect x="-19" y="-56" width="40" height="3"/>
        <rect x="-19" y="-44" width="40" height="3"/>
        <rect x="-19" y="-32" width="40" height="3"/>
        <rect x="-19" y="-20" width="40" height="3"/>
        <rect x="-19" y="-8" width="40" height="3"/>
        <rect x="-19" y="4" width="40" height="3"/>
        <rect x="-19" y="16" width="40" height="3"/>
        <rect x="-19" y="28" width="40" height="3"/>
        <rect x="-19" y="40" width="40" height="3"/>
        <rect x="-19" y="52" width="40" height="3"/>
        <rect x="-19" y="64" width="40" height="3"/>
        <rect x="-19" y="76" width="40" height="3"/>
        <rect x="-19" y="88" width="40" height="3"/>
        <rect x="-19" y="100" width="40" height="3"/>
        <rect x="-19" y="112" width="40" height="3"/>
        <rect x="-19" y="124" width="40" height="3"/>
        <rect x="-19" y="136" width="40" height="3"/>
        <rect x="-19" y="148" width="40" height="3"/>
        <rect x="-19" y="160" width="40" height="3"/>
        <rect x="-19" y="172" width="40" height="3"/>
      </g>

      <g opacity="0.12">
        <rect x="-20" y="-180" width="2" height="112" fill="#000000"/>
        <rect x="22" y="-180" width="2" height="112" fill="#000000"/>
      </g>
    </g>

    <!-- TOOL BOX -->
    <g>
      <rect x="36" y="54" width="36" height="125" fill="#000000" opacity="0.2"/>
      <rect x="34" y="52" width="36" height="125" rx="2" fill="url(#toolbox-red)" stroke="#4A0606" stroke-width="0.8"/>
      <rect x="36" y="54" width="32" height="2" fill="#D42828" opacity="0.6"/>
      <rect x="34" y="52" width="2" height="125" fill="#8B1010" opacity="0.4"/>
      <line x1="52" y1="52" x2="52" y2="177" stroke="#5A0A0A" stroke-width="0.4" stroke-dasharray="2,3" opacity="0.4"/>
      <rect x="39" y="112" width="6" height="2" fill="#3A0404" rx="0.3"/>
      <rect x="59" y="112" width="6" height="2" fill="#3A0404" rx="0.3"/>
    </g>

    <!-- TELESCOPIC SPOTLIGHT -->
    <g>
      <rect x="30" y="16" width="44" height="12" rx="1.5" fill="#6A6A62" stroke="#3A3A32" stroke-width="0.5"/>
      <rect x="32" y="18" width="40" height="8" fill="#7A7A72"/>

      <rect x="32" y="-4" width="40" height="24" rx="2.5" fill="url(#mast-white)" stroke="#6A6A62" stroke-width="0.8"/>

      <rect x="34" y="-2" width="36" height="20" rx="2" fill="#F4F2EA" stroke="#8A8A82" stroke-width="0.4"/>

      <rect x="34" y="-2" width="2" height="20" fill="#A8A8A0" opacity="0.5"/>
      <rect x="68" y="-2" width="2" height="20" fill="#A8A8A0" opacity="0.5"/>

      <circle cx="52" cy="8" r="9" fill="#C8C6BE" stroke="#4A4A42" stroke-width="0.8"/>
      <circle cx="52" cy="8" r="7.5" fill="#E8E6DE" stroke="#8A8A82" stroke-width="0.4"/>
      <circle cx="52" cy="8" r="6" fill="#F4F2EA"/>
      <circle cx="52" cy="8" r="4.5" fill="#C8C6BE" opacity="0.4"/>
      <circle cx="49" cy="5" r="2" fill="#FFFFFF" opacity="0.7"/>
      <circle cx="50" cy="6" r="1" fill="#FFFFFF" opacity="0.9"/>

      <rect x="68" y="4" width="5" height="8" fill="#4A4A42" rx="0.5"/>
      <rect x="69" y="5" width="3" height="6" fill="#6A6A62"/>

      <path d="M 73 8 Q 76 8 76 6" stroke="#2A2A2A" stroke-width="1" fill="none"/>
    </g>

    <!-- Hi-vis chequered at rear corners -->
    <g>
      <rect x="-80" y="72" width="5" height="12" fill="#F5D800"/>
      <rect x="-80" y="84" width="5" height="12" fill="#FFFFFF"/>
      <rect x="-80" y="96" width="5" height="12" fill="#F5D800"/>
    </g>
    <g>
      <rect x="75" y="72" width="5" height="12" fill="#F5D800"/>
      <rect x="75" y="84" width="5" height="12" fill="#FFFFFF"/>
      <rect x="75" y="96" width="5" height="12" fill="#F5D800"/>
    </g>

    <!-- Rear chevrons -->
    <g transform="translate(0, 185)">
      <rect x="-80" y="0" width="160" height="12" fill="#E8101C"/>
      <g fill="#F5D800">
        <polygon points="-78,12 -68,0 -58,0 -68,12"/>
        <polygon points="-58,12 -48,0 -38,0 -48,12"/>
        <polygon points="-38,12 -28,0 -18,0 -28,12"/>
        <polygon points="-18,12 -8,0 2,0 -8,12"/>
        <polygon points="2,12 12,0 22,0 12,12"/>
        <polygon points="22,12 32,0 42,0 32,12"/>
        <polygon points="42,12 52,0 62,0 52,12"/>
        <polygon points="62,12 72,0 78,0 78,4 72,12"/>
      </g>
    </g>

  </g>

</svg>
